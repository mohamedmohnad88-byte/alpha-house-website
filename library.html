<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE VOID — Knowledge Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/void.css" />
</head>
<body>
  <canvas id="nebula"></canvas>

  <nav class="v-nav">
    <div class="v-nav-inner">
      <a href="index.html" class="v-brand">
        <svg class="sigil" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1"><circle cx="13" cy="13" r="12"/><circle cx="13" cy="13" r="6"/><path d="M13 1 L13 25 M1 13 L25 13"/></svg>
        THE VOID
      </a>
      <button class="v-nav-toggle" aria-label="Menu">&#9776;</button>
      <div class="v-nav-links">
        <a href="index.html">Home</a>
        <a href="library.html">Library</a>
        <a href="path.html">Ascension</a>
        <a href="admin/login.html">Admin</a>
      </div>
    </div>
  </nav>

  <main class="v-section">
    <div class="v-container">
      <span class="v-eyebrow v-mono">Knowledge Engine</span>
      <h1>The Library.</h1>
      <p style="max-width:720px;color:var(--v-text-muted);margin-bottom:32px;">
        Eleven domains of the mind. Original articles, practical applications, verifiable references.
      </p>

      <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:32px;align-items:center;">
        <div class="v-search-wrap">
          <span class="v-search-icon">&#128269;</span>
          <input class="v-input" id="searchInput" placeholder="Search articles, topics, tags..." />
        </div>
        <select class="v-select" id="catFilter" style="max-width:260px;">
          <option value="">All Categories</option>
        </select>
        <select class="v-select" id="stageFilter" style="max-width:200px;">
          <option value="">All Stages</option>
        </select>
        <label class="v-chip" style="cursor:pointer;"><input type="checkbox" id="favOnly" style="display:none;" /> Favorites only</label>
      </div>

      <div id="catChips" style="margin-bottom:24px;"></div>

      <div id="articleGrid" class="v-grid v-grid-3"></div>
      <div id="emptyState" class="v-empty" style="display:none;">No articles match your search.</div>
    </div>
  </main>

  <footer class="v-footer">
    <div class="v-container"><p>THE VOID &mdash; Knowledge is not power. Applied knowledge is.</p></div>
  </footer>

  <div class="v-settings">
    <button aria-label="Settings">&#9881;</button>
    <div class="v-settings-panel">
      <label>Reduce motion <input type="checkbox" data-setting="reduceMotion" /></label>
      <label>Sound <input type="checkbox" data-setting="sound" /></label>
    </div>
  </div>
  <div class="v-toast"></div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/void-core.js"></script>
  <script src="js/library.js"></script>
</body>
</html>
