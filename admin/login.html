<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول — Alpha House Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="admin-body">
  <div class="admin-login-wrap">
    <div class="admin-login-card">
      <div class="logo" style="justify-content:center;margin-bottom:24px;">
        <span class="logo-mark">A</span>
        <span><span class="logo-text">Alpha House</span><span class="logo-sub">Admin Panel</span></span>
      </div>
      <h2 style="text-align:center;margin-bottom:8px;">تسجيل الدخول</h2>
      <p style="text-align:center;color:var(--text-muted);margin-bottom:24px;font-size:0.9rem;">لوحة إدارة Alpha House Real Estate</p>
      <form id="loginForm">
        <div class="form-group">
          <label>البريد الإلكتروني</label>
          <input type="email" id="email" required />
        </div>
        <div class="form-group">
          <label>كلمة المرور</label>
          <input type="password" id="password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">دخول</button>
        <p class="form-status" id="status"></p>
      </form>
      <p style="text-align:center;color:var(--text-dim);font-size:0.8rem;margin-top:16px;">
        ملاحظة: يجب إعداد Supabase في js/config.js أولاً. ثم إنشاء حساب عبر Supabase Auth، وتعيين role='admin' в جدول profiles.
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const status = document.getElementById('status');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!window.AH.isConfigured) {
        status.textContent = 'Supabase غير مُعد. عدّل js/config.js.';
        status.className = 'form-status error';
        return;
      }
      status.textContent = 'جاري تسجيل الدخول...';
      status.className = 'form-status';
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const { data, error } = await window.AH.sb.auth.signInWithPassword({ email, password });
      if (error) {
        status.textContent = error.message;
        status.className = 'form-status error';
        return;
      }
      // check admin role
      const { data: prof } = await window.AH.sb.from('profiles').select('role').eq('id', data.user.id).maybeSingle();
      if (!prof || prof.role !== 'admin') {
        await window.AH.sb.auth.signOut();
        status.textContent = 'هذا الحساب ليس مديراً.';
        status.className = 'form-status error';
        return;
      }
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
