<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول — Alpha House Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="admin-body">
  <div class="admin-login-wrap">
    <div class="admin-login-card">
      <div class="logo" style="justify-content:center;margin-bottom:24px;">
        <span class="logo-mark">A</span>
        <span><span class="logo-text">Alpha House</span><span class="logo-sub">Admin Panel</span></span>
      </div>
      <h2 style="text-align:center;margin-bottom:8px;">تسجيل الدخول</h2>
      <p style="text-align:center;color:var(--text-muted);margin-bottom:24px;font-size:0.9rem;">لوحة إدارة Alpha House Real Estate</p>
      <form id="loginForm">
        <div class="form-group">
          <label>كلمة المرور (Admin)</label>
          <input type="password" id="password" required placeholder="أدخل كلمة المرور" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">دخول</button>
        <p class="form-status" id="status"></p>
      </form>
      <p style="text-align:center;color:var(--text-dim);font-size:0.75rem;margin-top:12px;">
        كلمة المرور الافتراضية: <strong>admin123</strong> (يمكن تغييرها من لوحة التحكم)
      </p>
    </div>
  </div>

  <script>
    const ADMIN_PASSWORD = localStorage.getItem('ah_admin_password') || 'admin123';
    const form = document.getElementById('loginForm');
    const status = document.getElementById('status');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const pw = document.getElementById('password').value;
      if (pw === ADMIN_PASSWORD) {
        sessionStorage.setItem('ah_admin', '1');
        status.textContent = 'تم تسجيل الدخول بنجاح';
        status.className = 'form-status success';
        setTimeout(() => { window.location.href = 'index.html'; }, 500);
      } else {
        status.textContent = 'كلمة المرور غير صحيحة';
        status.className = 'form-status error';
      }
    });
  </script>
</body>
</html>
